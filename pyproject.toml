[project]
name = "projet-fraude-etl"
version = "0.2.0"
description = "Pipeline ETL Streaming - Détection d'Anomalies Crypto Temps Réel via Redpanda"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka==2.3.0",
    "websocket-client==1.7.0",
    "psycopg2-binary==2.9.9",
    "pyarrow",
    "pytest"
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"