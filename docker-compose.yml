version: "3.8"

services:
  # -----------------------------------------------------------
  # 1. LA BASE DE DONNÉES (Le Hot Storage)
  # -----------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-crypto_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Si vous avez créé le fichier infra/db/init.sql, décommentez la ligne ci-dessous :
      # - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------
  # 2. LE BROKER DE MESSAGING (Redpanda)
  # -----------------------------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy|Unhealthy' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # -----------------------------------------------------------
  # 3. L'OBSERVABILITÉ KAFKA
  # -----------------------------------------------------------
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda_console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  # -----------------------------------------------------------
  # 4. LE PRODUCTEUR (Connecteur Binance)
  # -----------------------------------------------------------
  detecteur_binance_v2:
    build: . 
    container_name: producteur_binance
    # CRITIQUE : Instruction pour exécuter le bon script
    command: python src/producer_binance.py
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy

  # -----------------------------------------------------------
  # 5. LE CONSOMMATEUR (Logique Métier & Insertion DB)
  # -----------------------------------------------------------
  etl_moteur:
    build: . 
    container_name: consommateur_etl
    # CRITIQUE : Instruction pour exécuter le bon script
    command:  python src/consumer_etl.py
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # -----------------------------------------------------------
  # 6. LE TABLEAU DE BORD (Metabase)
  # -----------------------------------------------------------
  metabase:
    image: metabase/metabase:latest
    container_name: metabase_dashboard
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

# Déclaration du volume persistant pour la base de données
volumes:
  postgres_data: