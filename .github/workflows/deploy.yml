deploy-aws:
    name: 🚀 Déploiement sur EC2
    needs: lint-et-tests
    runs-on: ubuntu-latest
    steps:
      - name: 🌐 Connexion SSH et Déploiement
        uses: appleboy/ssh-action@v1.0.0
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_USER,DB_PASSWORD,DB_NAME
          script: |
           # 1. Clonage la première fois, ou simple déplacement
           if [ ! -d "/home/ubuntu/Detection_fraude" ]; then
             git clone https://github.com/ahmed-beji/Detection_fraude.git /home/ubuntu/Detection_fraude
           fi
           
           cd /home/ubuntu/Detection_fraude
           sudo chown -R ubuntu:ubuntu /home/ubuntu/Detection_fraude
           git config --global --add safe.directory /home/ubuntu/Detection_fraude
           
           # 2. Mise à jour du code
           git pull origin main
           
           # 3. Création du fichier .env pour que PostgreSQL puisse démarrer
           echo "DB_USER=$DB_USER" > .env
           echo "DB_PASSWORD=$DB_PASSWORD" >> .env
           echo "DB_NAME=$DB_NAME" >> .env
           echo "WHALE_THRESHOLD=50000.0" >> .env
           
           # 4. Lancement de l'architecture (Attention : espace, pas de tiret)
           docker compose up -d --build